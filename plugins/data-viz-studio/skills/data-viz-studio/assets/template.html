<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7B3FF2; --accentText:#7B3FF2; --main:#12B5E5; --second:#4E8290; --bad:#D0364A; --good:#2E8B55;
  --bg:#F8FCFC; --raised:#F0F6F7; --surface:#FFFFFF; --text:#131516; --selected:#E7F5F8;
  --grey200:#E9EBEC; --grey400:#D4D7D8; --grey500:#B0B4B5; --grey700:#6D7A7E;
  --fhead:Sora,Lexend,system-ui,sans-serif; --fbody:'DM Sans',Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fbody);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);display:flex;min-height:100vh}
h1,h2,h3{font-family:var(--fhead)}
h1{font-size:22px;font-weight:600;letter-spacing:-0.5px}
h2{font-size:16px;font-weight:500;letter-spacing:-0.3px;margin-bottom:4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accentText)}
#side{width:212px;flex-shrink:0;background:var(--raised);padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#side .logo{padding:0 20px 18px;border-bottom:1px solid var(--grey200);margin-bottom:14px}
#side .logo h1{font-size:15px;line-height:1.3}
#side .logo .eyebrow{margin-bottom:4px}
.nav-item{display:block;padding:8px 20px;cursor:pointer;color:var(--grey700);font-weight:500;border-left:3px solid transparent}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);border-left-color:var(--accent);background:var(--bg);font-weight:600}
#themes{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--grey200)}
#themes .l{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--grey700);margin-bottom:6px}
.theme{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--fbody);font-size:12.5px;color:var(--grey700);text-align:left}
.theme.on{color:var(--text);font-weight:700}
.theme i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:-5px;box-shadow:0 0 0 1.5px var(--raised)} .theme span{margin-left:8px}
#main{flex:1;padding:24px 28px;max-width:1240px;min-width:0}
#filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;padding:12px 14px;background:var(--raised);border-radius:8px}
.fdrop{position:relative}
.fdrop>button{font-family:var(--fbody);font-size:13px;font-weight:600;padding:6px 12px;border-radius:1000px;border:1px solid var(--grey400);background:var(--surface);cursor:pointer;color:var(--text)}
.fdrop>button.on{border-color:var(--second);background:var(--selected)}
.fdrop .panel{display:none;position:absolute;top:34px;left:0;z-index:30;background:var(--surface);border:1px solid var(--grey200);border-radius:8px;padding:10px;min-width:210px;max-height:290px;overflow-y:auto;box-shadow:0 4px 14px rgba(18,16,22,.10)}
.fdrop.open .panel{display:block}
.panel label{display:flex;gap:7px;align-items:center;padding:3px 2px;cursor:pointer;font-size:13px;white-space:nowrap}
.panel .srch{width:100%;font-family:var(--fbody);font-size:12.5px;padding:4px 8px;margin-bottom:6px;border:1px solid var(--grey400);border-radius:6px}
.grain{display:flex;border:1px solid var(--grey400);border-radius:1000px;overflow:hidden;margin-left:auto}
.grain button{font-family:var(--fbody);font-size:12px;font-weight:600;padding:6px 12px;border:0;background:var(--surface);cursor:pointer;color:var(--grey700)}
.grain button.on{background:var(--second);color:#fff}
#reset{font-family:var(--fbody);font-size:12px;font-weight:600;background:none;border:0;color:var(--grey700);cursor:pointer;text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--raised);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--fhead);font-size:24px;font-weight:600;letter-spacing:-1px;line-height:1.15}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--grey700);text-transform:uppercase;letter-spacing:.6px}
.kpi .s{font-size:11.5px;color:var(--grey700)}
.kpi.accent .v{color:var(--accentText)} .kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid2 .wide{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--grey200);border-radius:8px;padding:16px;margin-bottom:14px;min-width:0}
.card p.note{font-size:12px;color:var(--grey700);margin-top:2px}
.chartbox{position:relative;height:300px;margin-top:10px}
.chartbox.tall{height:420px}
select.brk{font-family:var(--fbody);font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--grey400);background:var(--surface);color:var(--text)}
.brkrow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--grey700)}
.tblwrap{max-height:520px;overflow:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:700;padding:6px 8px;border-bottom:2px solid var(--grey200);position:sticky;top:0;background:var(--surface)}
td{padding:5px 8px;border-bottom:1px solid var(--grey200)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.dead td{color:var(--grey500)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 9px;border-radius:1000px}
.tag.dead{background:#FBE4E9;color:var(--bad)} .tag.const{background:var(--grey200);color:var(--grey700)} .tag.ok{background:#E2F0E6;color:var(--good)}
.pagehead{margin-bottom:14px}
.pagehead p{color:var(--grey700);max-width:860px;font-size:13px}
.empty{padding:40px 0;text-align:center;color:var(--grey700);font-size:13px}
#footnote{font-size:11.5px;color:var(--grey500);margin-top:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}#side{display:none}}
</style>
</head>
<body>
<nav id="side">
  <div class="logo">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="dtitle"></h1>
  </div>
  <div id="nav"></div>
  <div id="themes"></div>
</nav>
<div id="main">
  <div id="filters"></div>
  <div id="page"></div>
  <div id="footnote"></div>
</div>
<script>/*__CHARTJS__*/</script>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#D0364A;color:#fff;font:12px monospace;padding:6px 10px;z-index:99';document.body.appendChild(b);}b.textContent='Dashboard error: '+e.message;});
</script>
<script type="application/json" id="viz-data">__DATA_JSON__</script>
<script type="application/json" id="viz-config">__CONFIG_JSON__</script>
<script type="application/json" id="viz-palettes">__PALETTES_JSON__</script>
<script>
const DATA=JSON.parse(document.getElementById('viz-data').textContent);
const CFG=JSON.parse(document.getElementById('viz-config').textContent);
const PALETTES=JSON.parse(document.getElementById('viz-palettes').textContent);
const COL={};DATA.cols.forEach((c,i)=>{COL[c.key]=Object.assign({i},c);});
const DIMS=DATA.dims;
const CUR=CFG.currency||'£';

/* ---------- palette ---------- */
let P={};
function applyPalette(name){
  if(!PALETTES[name])name=Object.keys(PALETTES)[0];
  const p=PALETTES[name];P=Object.assign({name},p);
  const r=document.documentElement.style;
  const map={accent:'accent',accentText:'accentText',main:'main',second:'second',bad:'bad',good:'good',bg:'bg',raised:'raised',surface:'surface',text:'text',selected:'selectedTint',grey200:'grey200',grey400:'grey400',grey500:'grey500',grey700:'grey700'};
  for(const k in map)r.setProperty('--'+k,p[map[k]]);
  if(typeof Chart!=='undefined'){
    Chart.defaults.font.family=getComputedStyle(document.documentElement).getPropertyValue('--fbody');
    Chart.defaults.font.size=11.5;Chart.defaults.color=p.grey700;Chart.defaults.borderColor=p.grey200;
    Chart.defaults.plugins.legend.labels.boxWidth=10;Chart.defaults.plugins.legend.labels.boxHeight=10;
  }
}
function col(name,i){
  if(!name)name='main';
  if(name==='seqMain'||name==='seqSecond')return P[name][(i||0)%P[name].length];
  return P[name]||name;
}
function alpha(hex,a){const h=hex.replace('#','');const n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

/* ---------- state ---------- */
const FILTERS=(CFG.filters||[]).filter(k=>COL[k]&&DIMS[k]);
const BREAKDOWNS=(CFG.breakdowns||[]).filter(k=>COL[k]&&DIMS[k]);
const UK=CFG.uniqueKey&&COL[CFG.uniqueKey.col]?CFG.uniqueKey:null;
const state={page:(CFG.pages[0]||{}).id,grain:UK?'unique':'rows',filters:{},brk:{},search:{},pick:{}};
function setDefaultFilters(){FILTERS.forEach(d=>{state.filters[d]=new Set(((CFG.defaultFilters||{})[d]||[]).map(v=>DIMS[d].indexOf(String(v))).filter(i=>i>=0));});}
setDefaultFilters();
const label=k=>COL[k]?COL[k].label:k;

/* ---------- data helpers ---------- */
function filteredRows(){
  const act=FILTERS.filter(d=>state.filters[d].size>0);
  if(!act.length)return DATA.rows;
  return DATA.rows.filter(r=>act.every(d=>state.filters[d].has(r[COL[d].i])));
}
/* rows for a KPI/chart: global filters, then pinned `where` / `exclude` / `pick` (a pinned dim ignores its global filter) */
function scopeRows(obj,pg){
  const w=Object.assign({},(pg&&pg.where)||{},obj.where||{});
  const nw=Object.assign({},(pg&&pg.exclude)||{},obj.exclude||{});
  if(obj.pick&&COL[obj.pick.dim])w[obj.pick.dim]=[pickVal(obj)];
  const toIdx=(d,vals)=>new Set([].concat(vals).map(v=>DIMS[d].indexOf(String(v))));
  const wi=Object.entries(w).filter(([d])=>COL[d]&&DIMS[d]).map(([d,v])=>[COL[d].i,toIdx(d,v)]);
  const ni=Object.entries(nw).filter(([d])=>COL[d]&&DIMS[d]).map(([d,v])=>[COL[d].i,toIdx(d,v)]);
  const act=FILTERS.filter(d=>state.filters[d].size>0&&!(d in w)).map(d=>[COL[d].i,state.filters[d]]);
  if(!wi.length&&!ni.length&&!act.length)return DATA.rows;
  return DATA.rows.filter(r=>act.every(([i,s])=>s.has(r[i]))&&wi.every(([i,s])=>s.has(r[i]))&&ni.every(([i,s])=>!s.has(r[i])));
}
function pickVal(obj){
  const d=obj.pick.dim,k=obj._id;
  if(state.pick[k]==null){const def=obj.pick.default!=null?String(obj.pick.default):DIMS[d][DIMS[d].length-1];state.pick[k]=def;}
  return state.pick[k];
}
function uniqRows(rows){
  if(!UK)return rows;const i=COL[UK.col].i,seen=new Set(),out=[];
  for(const r of rows){const v=r[i];if(v==null){out.push(r);continue;}if(!seen.has(v)){seen.add(v);out.push(r);}}
  return out;
}
function grainLabel(){return state.grain==='unique'?(UK.label||'unique'):(CFG.rowLabel||'rows');}
function rowsFor(metric,fr){return (metric.agg==='count'&&state.grain==='unique')?uniqRows(fr):fr;}
function q(sorted,p){if(!sorted.length)return null;const i=(sorted.length-1)*p,lo=Math.floor(i);return sorted[lo]+(sorted[Math.min(lo+1,sorted.length-1)]-sorted[lo])*(i-lo);}

/* aggregate one set of rows to a single value */
function aggregate(rows,m){
  switch(m.agg){
    case 'count':return rows.length;
    case 'distinct':{const i=COL[m.dim].i,s=new Set();for(const r of rows)if(r[i]!=null&&r[i]>=0)s.add(r[i]);return s.size;}
    case 'ratio':{const a=COL[m.num].i,b=COL[m.den].i;let x=0,y=0;for(const r of rows){if(r[a]!=null&&r[b]!=null){x+=r[a];y+=r[b];}}return y?x/y*(m.scale||1):null;}
    case 'growth':{ // change between two values of an ordered dim; cagr:true annualises
      const di=COL[m.dim].i,a=DIMS[m.dim].indexOf(String(m.from)),b=DIMS[m.dim].indexOf(String(m.to));
      const inner=Object.assign({},m,{agg:m.of||'sum'});
      const va=aggregate(rows.filter(r=>r[di]===a),inner),vb=aggregate(rows.filter(r=>r[di]===b),inner);
      if(!va||vb==null)return null;
      if(m.cagr){const n=m.periods||(parseFloat(m.to)-parseFloat(m.from))||1;return Math.pow(vb/va,1/n)-1;}
      return vb/va-1;}
    case 'share':{ // share of rows matching a dim value
      const i=COL[m.dim].i,vi=DIMS[m.dim].indexOf(m.value);let n=0;for(const r of rows)if(r[i]===vi)n++;return rows.length?n/rows.length:null;}
    default:{
      const i=COL[m.measure].i;const v=[];for(const r of rows)if(r[i]!=null)v.push(r[i]);
      if(!v.length)return null;
      if(m.agg==='sum')return v.reduce((a,b)=>a+b,0);
      if(m.agg==='mean')return v.reduce((a,b)=>a+b,0)/v.length;
      v.sort((a,b)=>a-b);
      if(m.agg==='median')return q(v,.5);
      if(m.agg==='min')return v[0];
      if(m.agg==='max')return v[v.length-1];
      if(m.agg==='p25')return q(v,.25);
      if(m.agg==='p75')return q(v,.75);
      return null;
    }
  }
}
/* group rows by a dim, aggregate each group */
function groupAgg(rows,dim,m){
  const n=DIMS[dim].length,groups=Array.from({length:n},()=>[]),i=COL[dim].i;
  for(const r of rows){const v=r[i];if(v!=null&&v>=0)groups[v].push(r);}
  return groups.map(g=>({n:g.length,v:g.length?aggregate(g,m):null}));
}

/* ---------- formatting ---------- */
function compact(n){
  if(n==null||isNaN(n))return'–';const a=Math.abs(n);
  if(a>=1e9)return(n/1e9).toFixed(1)+'B';if(a>=1e6)return(n/1e6).toFixed(1)+'M';
  if(a>=1e4)return(n/1e3).toFixed(0)+'k';if(a>=100)return Math.round(n).toLocaleString();
  if(a>=10)return n.toLocaleString(undefined,{maximumFractionDigits:1});
  return n.toLocaleString(undefined,{maximumFractionDigits:a<1?3:2});
}
function metricFormat(m){
  if(m.format)return m.format;
  if(m.agg==='count'||m.agg==='distinct')return 'number';
  if(m.agg==='share'||m.agg==='growth')return 'percent';
  if(m.agg==='ratio')return 'number';
  return (COL[m.measure]&&COL[m.measure].format)||'number';
}
function fmtVal(v,format,suf){
  if(v==null||isNaN(v))return'–';suf=suf||'';
  switch(format){
    case 'currency':return (v<0?'-':'')+CUR+(Math.abs(v)<10&&!suf?Math.abs(v).toFixed(2):compact(Math.abs(v)))+suf;
    case 'percent':return (100*v).toFixed(Math.abs(v)<1?1:0)+'%';
    case 'pctpoints':return v.toFixed(1)+'%';
    case 'seconds':return v.toFixed(1)+'s';
    case 'decimal':return v.toFixed(2)+suf;
    default:return compact(v)+suf;
  }
}
function metricSuffix(m){
  if(m.suffix!=null)return m.suffix;
  if(['count','distinct','share','growth','ratio'].includes(m.agg))return '';
  return (CFG.suffix||{})[m.measure]||'';
}
function metricName(m){
  if(m.label)return m.label;
  if(m.agg==='count')return grainLabel();
  if(m.agg==='distinct')return 'distinct '+label(m.dim);
  if(m.agg==='ratio')return label(m.num)+' ÷ '+label(m.den);
  return m.agg+' '+label(m.measure);
}
/* chart display value: percent shown as 0-100 */
const dispV=(v,f)=>v==null?null:(f==='percent'?+(100*v).toFixed(2):+(+v).toFixed(4));
function tickCb(f,suf){suf=suf||'';return v=>f==='percent'?v+'%':f==='currency'?CUR+compact(v)+suf:f==='pctpoints'?v+'%':compact(v)+suf;}

/* ---------- chart registry ---------- */
const charts={};
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(el,cfg);}
function baseOpts(f,horizontal,extra,suf){
  suf=suf||'';const valAxis={beginAtZero:true,ticks:{callback:tickCb(f,suf)}};
  const catAxis={grid:{display:false},ticks:{autoSkip:true,maxRotation:0}};
  const o={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
    tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+': ':'')+(f==='percent'?(+c.raw).toFixed(1)+'%':f==='currency'?CUR+(+c.raw).toLocaleString(undefined,{maximumFractionDigits:2})+suf:f==='pctpoints'?(+c.raw).toFixed(1)+'%':(+c.raw).toLocaleString(undefined,{maximumFractionDigits:2})+suf)}}},
    scales:horizontal?{x:valAxis,y:catAxis}:{x:catAxis,y:valAxis}};
  if(horizontal)o.indexAxis='y';
  return Object.assign(o,extra||{});
}
const ORDERED=new Set(CFG.ordered||[]);
const isDate=d=>COL[d]&&(COL[d].role==='date'||ORDERED.has(d)||(DIMS[d]&&DIMS[d].length>1&&DIMS[d].every(v=>/^(FY)?\s?-?\d{2,4}(\.\d+)?$/i.test(v))));
/* order indexes: dates keep natural order, categories sorted desc by value, top N */
function orderIdx(vals,dim,topN,asc){
  let idx=vals.map((x,i)=>i).filter(i=>vals[i]!=null&&(isDate(dim)||vals[i]!==0));
  if(!isDate(dim))idx.sort((a,b)=>asc?vals[a]-vals[b]:vals[b]-vals[a]);
  if(topN&&!isDate(dim))idx=idx.slice(0,topN);
  return idx;
}

/* ---------- chart renderers ---------- */
function effDim(c,field){ // breakdown selector may override a field
  field=field||'dim';
  if(c.breakdown&&(c.breakdownField||'dim')===field)return state.brk[c._id]||c[field];
  return c[field];
}
function drawChart(c,fr){
  const id=c._id,m=c.metric||{agg:'count'},f=metricFormat(m),suf=metricSuffix(m),rows=rowsFor(m,fr);
  const minN=c.minGroup||1;
  const t=c.type;
  if(t==='bar'||t==='hbar'||t==='doughnut'){
    const dim=effDim(c);const g=groupAgg(rows,dim,m);
    const vals=g.map(x=>x.n>=minN?x.v:null);
    const idx=orderIdx(vals,dim,c.topN||(t==='doughnut'?8:12),c.ascending);
    const labels=idx.map(i=>DIMS[dim][i]+(c.showN?' ('+compact(g[i].n)+')':''));
    const data=idx.map(i=>dispV(vals[i],f));
    if(t==='doughnut'){
      mk(id,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:idx.map((_,k)=>col('seqMain',k)),borderColor:P.surface}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});return;
    }
    const colors=c.colorBy==='sign'?data.map(v=>v<0?P.bad:P.good):col(c.color||(t==='hbar'?'main':'main'));
    mk(id,{type:'bar',data:{labels,datasets:[{label:metricName(m),data,backgroundColor:colors,borderRadius:3}]},options:baseOpts(f,t==='hbar',null,suf)});
    return;
  }
  if(t==='line'||t==='area'){
    const dim=c.dim;const series=effDim(c,'series');
    const metrics=c.metrics||[m];
    let datasets=[];
    if(series){
      const tot=groupAgg(rows,series,{agg:'count'}).map(x=>x.n);
      const top=orderIdx(tot,series,c.topSeries||5);
      datasets=top.map((si,k)=>{
        const sub=rows.filter(r=>r[COL[series].i]===si);
        return {label:DIMS[series][si],data:groupAgg(sub,dim,m).map(x=>dispV(x.v,f)),borderColor:col('seqMain',k),backgroundColor:col('seqMain',k),pointRadius:1.5,tension:.25,spanGaps:true};
      });
    }else{
      const pal=['main','second','accent'];
      datasets=metrics.map((mm,k)=>{const cc=col(c.color&&k===0?c.color:pal[k%3]);
        return {label:metricName(mm),data:groupAgg(rowsFor(mm,fr),dim,mm).map(x=>dispV(x.v,metricFormat(mm))),borderColor:cc,backgroundColor:alpha(cc,.13),fill:t==='area'&&metrics.length===1,pointRadius:2,tension:.25,spanGaps:true};});
    }
    mk(id,{type:'line',data:{labels:DIMS[dim],datasets},options:baseOpts(f,false,{plugins:Object.assign(baseOpts(f,false,null,suf).plugins,{legend:{display:datasets.length>1}})},suf)});
    return;
  }
  if(t==='stacked'||t==='share'){
    const dim=effDim(c,'dim'),series=effDim(c,'series');
    const si=COL[series].i,di=COL[dim].i,nd=DIMS[dim].length;
    const serTot=groupAgg(rows,series,m).map(x=>x.v||0);
    let sIdx=orderIdx(serTot,series,isDate(series)?null:(c.topSeries||7));
    const other=!isDate(series)&&serTot.filter(v=>v>0).length>sIdx.length;
    const keepSet=new Set(sIdx);
    const buckets=Array.from({length:nd},()=>({}));
    const add=(d,key,r)=>{(buckets[d][key]=buckets[d][key]||[]).push(r);};
    for(const r of rows){const d=r[di];if(d==null||d<0)continue;const s=r[si];if(s==null||s<0)continue;add(d,keepSet.has(s)?s:'o',r);}
    const valsBy=buckets.map(b=>{const o={};for(const k in b)o[k]=aggregate(b[k],m)||0;return o;});
    const totals=valsBy.map(o=>Object.values(o).reduce((a,b)=>a+b,0));
    const cnt=buckets.map(b=>Object.values(b).reduce((a,x)=>a+x.length,0));
    let dIdx=totals.map((v,i)=>i).filter(i=>cnt[i]>=(t==='share'?Math.max(minN,1):1)&&totals[i]>0);
    if(!isDate(dim))dIdx=dIdx.sort((a,b)=>totals[b]-totals[a]).slice(0,c.topN||12);
    const labels=dIdx.map(i=>DIMS[dim][i]+(c.showN?' ('+compact(cnt[i])+')':''));
    const isOther=k=>k!=='o'&&/^(other|others|unknown|n\/a)$/i.test(String(DIMS[series][k]));
    sIdx=sIdx.filter(k=>!isOther(k)).concat(sIdx.filter(isOther)); // "Other" goes last, in grey
    const keys=sIdx.concat(other?['o']:[]);
    const pal=c.palette||'seqMain';
    const datasets=keys.map((k,n)=>({label:k==='o'?'Other':DIMS[series][k],
      data:dIdx.map(i=>{const v=valsBy[i][k]||0;return t==='share'?+(100*v/(totals[i]||1)).toFixed(2):dispV(v,f);}),
      backgroundColor:(k==='o'||isOther(k))?P.grey400:(c.semantic?[P.good,P.grey500,P.bad][n%3]:col(pal,n)),borderColor:P.surface,borderWidth:{top:1,bottom:0,left:0,right:0}}));
    const ff=t==='share'?'pctpoints':f;
    const sf=t==='share'?'':suf;const o=baseOpts(ff,!!c.horizontal,{plugins:Object.assign(baseOpts(ff,false,null,sf).plugins,{legend:{display:true}})},sf);
    const va=c.horizontal?'x':'y',ca=c.horizontal?'y':'x';
    o.scales[ca].stacked=true;o.scales[va].stacked=true;if(t==='share')o.scales[va].max=100;
    mk(id,{type:'bar',data:{labels,datasets},options:o});
    return;
  }
  if(t==='histogram'||t==='cumulative'){
    const mi=COL[c.measure].i,f2=COL[c.measure].format;
    const v=[];for(const r of uniqIf(c,fr))if(r[mi]!=null)v.push(r[mi]);v.sort((a,b)=>a-b);
    if(!v.length){document.getElementById(id).parentElement.innerHTML='<div class="empty">No values in current selection</div>';return;}
    const lo=c.min!=null?c.min:Math.min(0,v[0]),hi=c.max!=null?c.max:q(v,.98);
    const nb=c.bins||20,step=(hi-lo)/nb||1,h=new Array(nb+1).fill(0);
    for(const x of v){if(x>=hi)h[nb]++;else h[Math.max(0,Math.floor((x-lo)/step))]++;}
    const lab=i=>fmtVal(lo+i*step,f2);
    const labels=[...Array(nb).keys()].map(i=>lab(i)+'–'+lab(i+1)).concat([lab(nb)+'+']);
    if(t==='histogram'){
      mk(id,{type:'bar',data:{labels,datasets:[{label:'count',data:h,backgroundColor:col(c.color||'main'),borderRadius:2}]},options:baseOpts('number',false)});
    }else{
      let acc=0;const cum=h.map(x=>+(100*(acc+=x)/v.length).toFixed(2));
      const cc=col(c.color||'second');
      mk(id,{type:'line',data:{labels,datasets:[{label:'cumulative %',data:cum,borderColor:cc,backgroundColor:alpha(cc,.12),fill:true,pointRadius:0,tension:.25}]},
        options:baseOpts('pctpoints',false,{scales:{x:{grid:{display:false}},y:{max:100,beginAtZero:true,ticks:{callback:x=>x+'%'}}}})});
    }
    return;
  }
}
function uniqIf(c,fr){return c.grain==='unique'&&state.grain==='unique'?uniqRows(fr):fr;}

function drawTable(c,fr){
  const dim=effDim(c),metrics=c.metrics||[{agg:'count'}];
  const g=metrics.map(m=>groupAgg(rowsFor(m,fr),dim,m));
  let idx=g[0].map((x,i)=>i).filter(i=>g[0][i].n>0);
  if(!isDate(dim))idx.sort((a,b)=>(g[0][b].v||0)-(g[0][a].v||0));
  idx=idx.slice(0,c.topN||50);
  let h=`<div class="tblwrap"><table><thead><tr><th>${label(dim)}</th>${metrics.map(m=>`<th class="n">${metricName(m)}</th>`).join('')}</tr></thead><tbody>`;
  for(const i of idx)h+=`<tr><td>${esc(DIMS[dim][i])}</td>${metrics.map((m,k)=>`<td class="n">${fmtVal(g[k][i].v,metricFormat(m),metricSuffix(m))}</td>`).join('')}</tr>`;
  return h+'</tbody></table></div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ---------- filter UI ---------- */
function renderFilters(){
  const el=document.getElementById('filters');
  let html='<span style="font-size:12px;font-weight:700;color:var(--grey700)">FILTER</span>';
  for(const d of FILTERS){
    const n=state.filters[d].size;
    html+=`<div class="fdrop" data-dim="${d}"><button class="${n?'on':''}">${esc(label(d))}${n?' · '+n:''} ▾</button><div class="panel">`;
    if(DIMS[d].length>12)html+=`<input class="srch" data-dim="${d}" placeholder="Search…" value="${esc(state.search[d]||'')}">`;
    DIMS[d].forEach((v,i)=>{
      const hide=state.search[d]&&!String(v).toLowerCase().includes(state.search[d].toLowerCase());
      html+=`<label style="${hide?'display:none':''}"><input type="checkbox" data-dim="${d}" data-i="${i}" ${state.filters[d].has(i)?'checked':''}> ${esc(v)}</label>`;
    });
    html+='</div></div>';
  }
  if(FILTERS.length)html+='<button id="reset">reset</button>';
  if(UK)html+=`<div class="grain"><button data-g="unique" class="${state.grain==='unique'?'on':''}">${esc(UK.label)}</button><button data-g="rows" class="${state.grain==='rows'?'on':''}">${esc(CFG.rowLabel||'Rows')}</button></div>`;
  el.innerHTML=html;
  el.style.display=(FILTERS.length||UK)?'flex':'none';
  el.querySelectorAll('.fdrop>button').forEach(b=>b.onclick=e=>{
    const dd=b.parentElement,was=dd.classList.contains('open');
    el.querySelectorAll('.fdrop').forEach(x=>x.classList.remove('open'));
    if(!was)dd.classList.add('open');e.stopPropagation();
  });
  el.querySelectorAll('input.srch').forEach(s=>s.oninput=()=>{
    state.search[s.dataset.dim]=s.value;const panel=s.parentElement;
    panel.querySelectorAll('label').forEach(l=>{l.style.display=l.textContent.toLowerCase().includes(s.value.toLowerCase())?'':'none';});
  });
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const d=cb.dataset.dim,i=+cb.dataset.i;cb.checked?state.filters[d].add(i):state.filters[d].delete(i);render();
  });
  const rs=el.querySelector('#reset');if(rs)rs.onclick=()=>{setDefaultFilters();render();};
  el.querySelectorAll('.grain button').forEach(b=>b.onclick=()=>{state.grain=b.dataset.g;render();});
}
document.addEventListener('click',e=>{if(!e.target.closest('.fdrop'))document.querySelectorAll('.fdrop').forEach(x=>x.classList.remove('open'));});

function brkSel(c){
  const opts=(c.breakdownOptions||BREAKDOWNS).filter(k=>DIMS[k]);
  const field=c.breakdownField||'dim';
  if(!state.brk[c._id])state.brk[c._id]=c[field];
  let h=`<div class="brkrow">Break down by <select class="brk" data-c="${c._id}">`;
  for(const b of opts)h+=`<option value="${b}" ${state.brk[c._id]===b?'selected':''}>${esc(label(b))}</option>`;
  return h+'</select></div>';
}

function pickSel(c){
  const d=c.pick.dim,cur=pickVal(c);
  let h=`<div class="brkrow">${esc(c.pick.label||label(d))} <select class="pick" data-c="${c._id}">`;
  for(const v of DIMS[d])h+=`<option ${v===cur?'selected':''}>${esc(v)}</option>`;
  return h+'</select></div>';
}
/* ---------- pages ---------- */
function interp(s){return String(s||'').replace(/\{grain\}/g,grainLabel()).replace(/\{rows\}/g,compact(filteredRows().length));}
function renderPage(el){
  const pg=CFG.pages.find(p=>p.id===state.page)||CFG.pages[0];
  if(pg.type==='health'){renderHealth(el,pg);return;}
  const fr=scopeRows({},pg);
  let h=`<div class="pagehead"><h1>${esc(pg.title)}</h1>${pg.intro?`<p>${interp(pg.intro)}</p>`:''}</div>`;
  if(pg.kpis&&pg.kpis.length){
    h+='<div class="kpis">';
    for(const k of pg.kpis){
      const m=k.metric||{agg:'count'},kr=scopeRows(k,pg),sx=metricSuffix(m);
      let v;
      if(k.range){const a=aggregate(kr,Object.assign({},m,{agg:'p25'})),b=aggregate(kr,Object.assign({},m,{agg:'p75'}));v=fmtVal(a,metricFormat(m),sx)+'–'+fmtVal(b,metricFormat(m),sx);}
      else{const x=aggregate(rowsFor(m,kr),m);v=(k.signed&&x>0?'+':'')+fmtVal(x,metricFormat(m),sx);}
      h+=`<div class="kpi ${k.tone||''}"><div class="l">${esc(k.label)}</div><div class="v">${v}</div>${k.sub?`<div class="s">${esc(interp(k.sub))}</div>`:''}</div>`;
    }
    h+='</div>';
  }
  h+='<div class="grid2">';
  pg.charts.forEach((c,n)=>{
    c._id=pg.id+'_'+n;
    const note=[interp(c.note)].filter(Boolean).join('');
    const body=c.type==='table'?drawTable(c,scopeRows(c,pg)):`<div class="chartbox ${c.tall?'tall':''}"><canvas id="${c._id}"></canvas></div>`;
    h+=`<div class="card ${c.wide?'wide':''}"><h2>${esc(c.title)}</h2>${note?`<p class="note">${note}</p>`:''}${c.pick?pickSel(c):''}${c.breakdown?brkSel(c):''}${body}</div>`;
  });
  h+='</div>';
  el.innerHTML=h;
  pg.charts.forEach(c=>{if(c.type==='table')return;const cr=scopeRows(c,pg);
    if(!cr.length){const cv=document.getElementById(c._id);if(cv)cv.parentElement.innerHTML='<div class="empty">No rows for this chart in the current selection</div>';return;}
    drawChart(c,cr);});
  el.querySelectorAll('select.brk').forEach(s=>s.onchange=()=>{state.brk[s.dataset.c]=s.value;render();});
  el.querySelectorAll('select.pick').forEach(s=>s.onchange=()=>{state.pick[s.dataset.c]=s.value;render();});
}
function renderHealth(el,pg){
  let rows='';
  for(const [c,fill,uniq,role] of DATA.health){
    const dead=fill===0,cst=uniq<=1&&fill>0;
    rows+=`<tr class="${dead?'dead':''}"><td>${esc(c)}</td><td>${esc(role)}</td><td class="n">${fill}%</td><td class="n">${uniq.toLocaleString()}</td><td>${dead?'<span class="tag dead">EMPTY</span>':cst?'<span class="tag const">CONSTANT</span>':fill>=90?'<span class="tag ok">RICH</span>':''}</td></tr>`;
  }
  el.innerHTML=`<div class="pagehead"><h1>${esc(pg.title)}</h1><p>${interp(pg.intro||'Fill rate and number of unique values for every source column (unfiltered). Blank, "N/A" and similar placeholders count as empty. Columns marked "ignored" were free text or IDs and are not charted.')}</p></div>
  <div class="card"><div class="tblwrap" style="max-height:640px"><table><thead><tr><th>Column</th><th>Used as</th><th class="n">Filled</th><th class="n">Unique values</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- shell ---------- */
function renderNav(){
  document.getElementById('nav').innerHTML=CFG.pages.map(p=>`<div class="nav-item ${state.page===p.id?'active':''}" data-p="${p.id}">${esc(p.title)}</div>`).join('');
  document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{state.page=n.dataset.p;render();window.scrollTo(0,0);});
}
function renderThemes(){
  const el=document.getElementById('themes');
  if(CFG.lockPalette){el.style.display='none';return;}
  el.innerHTML='<div class="l">Palette</div>'+Object.entries(PALETTES).map(([k,p])=>
    `<button class="theme ${P.name===k?'on':''}" data-t="${k}">${(p.swatches||[p.accent,p.main,p.second]).map(c=>`<i style="background:${c}"></i>`).join('')}<span>${esc(p.label)}</span></button>`).join('');
  el.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{applyPalette(b.dataset.t);render();});
}
function render(){
  for(const k in charts){charts[k].destroy();delete charts[k];}
  const open=document.querySelector('.fdrop.open'),openDim=open?open.dataset.dim:null;
  renderNav();renderThemes();renderFilters();
  if(openDim){const dd=document.querySelector(`.fdrop[data-dim="${openDim}"]`);if(dd)dd.classList.add('open');}
  renderPage(document.getElementById('page'));
  const nf=FILTERS.reduce((a,d)=>a+state.filters[d].size,0);
  document.getElementById('footnote').textContent=
    `Source: ${DATA.source} · built ${DATA.built} · ${DATA.rows.length.toLocaleString()} rows${UK?' / '+uniqRows(DATA.rows).length.toLocaleString()+' '+UK.label.toLowerCase():''} · ${nf?nf+' filter(s) active':'no filters'}${UK?' · counting '+grainLabel().toLowerCase():''}`;
}
document.getElementById('eyebrow').textContent=CFG.eyebrow||'';
document.getElementById('dtitle').innerHTML=esc(CFG.title||'Data Explorer').replace(/\n/g,'<br>');
if(CFG.fonts){const r=document.documentElement.style;if(CFG.fonts.heading)r.setProperty('--fhead',CFG.fonts.heading);if(CFG.fonts.body)r.setProperty('--fbody',CFG.fonts.body);}
applyPalette(CFG.palette||Object.keys(PALETTES)[0]);
render();
</script>
